<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TFTG Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
/* Layout: a duty-roster board. Sticky top bar with month stepper and three big tabs; wide grids scroll inside their own frames. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#d9e0dd; --soft:#e9eeec;
  --accent:#0f6b5c; --accent-ink:#ffffff; --mark:#e8a317;
  --s:#cfeedd; --s-ink:#11553a; --o:#d3e5fb; --o-ink:#17457a; --c:#e6dcf7; --c-ink:#4b2b85; --m:#fbe4c4; --m-ink:#7a4a08;
  --x:#dfe3e2; --x-ink:#3c4744; --h:#fbd6dc; --h-ink:#8a1d33; --hol:#fff4d6; --sun:#f6efe4; --mv:#d7f0f5; --mv-ink:#0e5563;
  --bad:#b4232a; --bad-ink:#ffffff;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --panel:#17201d; --ink:#e4ece9; --muted:#97a6a0; --line:#2a3632; --soft:#1f2a26;
  --accent:#3fb59c; --accent-ink:#06120f; --mark:#f0b43a;
  --s:#1d4a36; --s-ink:#b5ecd0; --o:#1d3656; --o-ink:#bcd7fa; --c:#35285a; --c-ink:#dccdfb; --m:#4f3816; --m-ink:#f7d7a6;
  --x:#2f3936; --x-ink:#c3cfca; --h:#55222d; --h-ink:#ffc9d3; --hol:#3a321a; --sun:#2a251d; --mv:#16424b; --mv-ink:#b9ecf5;
  --bad:#e5545b; --bad-ink:#1a0506; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:8px;margin-left:auto}
.month h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0;min-width:10ch;text-align:center}
.status{font-size:.82rem;color:var(--muted);min-width:9ch;text-align:right;font-weight:600}
.status.bad{color:var(--bad)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:10px}
nav button{border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 1rem var(--f-body);padding:12px 8px;border-radius:12px;cursor:pointer}
nav button span{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button[aria-selected="true"] span{color:var(--accent-ink);opacity:.85}
main{padding-block:18px 60px;display:grid;gap:18px}
.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 .95rem var(--f-body);padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.big{font-size:1.4rem;padding:4px 16px;line-height:1}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.say{font-size:1.05rem;margin:0;max-width:70ch}
.say b{font-weight:700}
.hint{color:var(--muted);font-size:.9rem;max-width:75ch;margin:0}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;font:600 .8rem var(--f-mono);padding:3px 6px;border-radius:6px;font-style:normal}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k-S{background:var(--s);color:var(--s-ink)} .k-O{background:var(--o);color:var(--o-ink)} .k-C{background:var(--c);color:var(--c-ink)} .k-M{background:var(--m);color:var(--m-ink)}
.k-X,.k-L{background:var(--x);color:var(--x-ink)} .k-H{background:var(--h);color:var(--h-ink)} .k-V{background:var(--mv);color:var(--mv-ink)}
/* brushes */
.brushes{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,150px));z-index:4}
.brushes .lab{font-weight:700}
.brow{display:flex;flex-wrap:wrap;gap:8px}
.brush{border:3px solid transparent;border-radius:12px;font:700 .95rem var(--f-body);padding:8px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.brush.erase{background:var(--bg);color:var(--ink);border-color:var(--line)}
.brush.erase[aria-pressed="true"]{border-color:var(--ink)}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}
details.more[open] summary{margin-bottom:8px}
.store{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.store h3{font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.04em;margin:0;padding:12px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.store h3 .rule{font:500 .82rem var(--f-body);color:var(--muted);letter-spacing:0}
.store h3 .warn{margin-left:auto;font:700 .82rem var(--f-body);color:var(--bad);letter-spacing:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--soft);text-align:center;padding:0;height:34px;min-width:40px;font-size:.8rem}
.grid thead th{font-weight:700;color:var(--muted);background:var(--panel)}
.grid thead tr:first-child th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding-top:4px}
.grid thead tr:last-child th{color:var(--ink);font-family:var(--f-mono);border-bottom:1px solid var(--line)}
.grid .name{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;padding:0 10px;min-width:118px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:.9rem;border-right:1px solid var(--line)}
.grid .name em{font-style:normal;font-weight:500;color:var(--muted);font-size:.74rem}
.grid tr.storehead td{background:var(--soft);font:800 .78rem var(--f-display);letter-spacing:.08em;text-align:left;padding:6px 10px;height:auto}
.grid tr.storehead td.name{background:var(--soft)}
.grid .hol{background:var(--hol)}
.grid .sun{background:var(--sun)}
.grid thead .hol{color:var(--mark)}
.cell{display:flex;align-items:center;justify-content:center;height:28px;margin:3px 2px;border-radius:6px;font:600 .78rem var(--f-mono)}
.grid tr.sub td{color:var(--muted);font-size:.74rem;height:26px}
.grid tr.sub td.name{font-weight:600}
.flag{display:inline-block;background:var(--bad);color:var(--bad-ink);font:700 .6rem var(--f-body);padding:2px 3px;border-radius:4px;line-height:1.1;writing-mode:vertical-rl;transform:rotate(180deg);max-height:64px}
.grid tr.chk td{height:auto;padding-block:3px}
.grid td.tot{font-family:var(--f-mono);font-weight:600;min-width:38px}
.grid .first{border-left:1px solid var(--line)}
button.dc{width:36px;height:34px;margin:2px;border:1px dashed var(--line);border-radius:7px;background:transparent;color:var(--ink);font:600 .74rem var(--f-mono);cursor:pointer;padding:0}
button.dc:hover{border-color:var(--accent);border-style:solid}
button.dc.has{border-style:solid;border-color:transparent}
button.dc.wk{background:repeating-linear-gradient(135deg,var(--x),var(--x) 3px,transparent 3px,transparent 7px);color:var(--x-ink)}
button.dc.hd{background:repeating-linear-gradient(135deg,var(--h),var(--h) 3px,transparent 3px,transparent 7px);color:var(--h-ink)}
/* today */
.today{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:14px;display:grid;gap:12px}
.today h3{font-family:var(--f-display);font-weight:800;margin:0;font-size:1.2rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tstore{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;min-width:0}
.tstore b{font-family:var(--f-display);letter-spacing:.05em}
.tline{display:flex;gap:8px;align-items:baseline;font-size:.92rem}
.tline .chip{min-width:72px;font-family:var(--f-body);font-weight:700}
/* setup */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.sec>summary{cursor:pointer;padding:16px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::after{content:"Open";font:700 .85rem var(--f-body);color:var(--accent)}
details.sec[open]>summary::after{content:"Close"}
details.sec>summary small{font:500 .85rem var(--f-body);color:var(--muted);display:block}
.secbody{padding:0 16px 16px;display:grid;gap:14px}
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
input.t,select.t{font:500 1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;min-height:44px}
input.t.num{width:7ch;font-family:var(--f-mono)}
input.t.code{width:7ch;font-family:var(--f-mono);text-transform:uppercase}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{border:2px solid var(--line);background:var(--bg);color:var(--muted);font:700 .78rem var(--f-body);width:40px;height:40px;border-radius:9px;cursor:pointer}
.days button.uw{width:58px;height:52px;display:grid;place-content:center;gap:1px;line-height:1.1}
button[data-train][aria-pressed="true"]{background:var(--m);color:var(--m-ink);border-color:var(--m-ink)}
.days button.uw small{font-size:.68rem;font-weight:600}
.days button.uw[class*="k-"]{border-color:transparent}
.subcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px}
.subcard h4{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:.04em}
.midtable{border-collapse:collapse}
.midtable th,.midtable td{padding:4px 6px;text-align:center;font-size:.85rem}
.midtable th:first-child,.midtable td:first-child{text-align:left;font-weight:700}
.inline-confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink);margin-bottom:6px}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:8px;max-width:75ch}
code{font-family:var(--f-mono);font-size:.85em;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (max-width:560px){.month{margin-left:0;width:100%;justify-content:space-between}.status{min-width:0}.brushes{position:static}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap">
    <div class="bar">
      <div class="brand">TFTG Roster</div>
      <div class="month">
        <button class="btn big" id="prev" aria-label="Previous month">‹</button>
        <h2 id="mlabel">—</h2>
        <button class="btn big" id="next" aria-label="Next month">›</button>
        <span class="status" id="status"></span>
      </div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="dayoffs">1. Day offs<span>Tap who is off</span></button>
      <button role="tab" data-tab="schedule">2. Schedule<span>See who works</span></button>
      <button role="tab" data-tab="setup">Setup<span>Staff, stores, holidays</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty"><b>Loading your roster</b>Your stores, staff and day offs will appear here.</div>
</main>

<script>
(()=>{
"use strict";
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const LETTERS="SOCM";
const WORD={S:"Straight",O:"Opening",C:"Closing",M:"Mid shift",X:"Day off",H:"Holiday off",VL:"Vacation leave",SL:"Sick leave"};
const LS="tftg-roster-settings";
let conn={url:"",pin:""};
try{conn=Object.assign(conn,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
let cfg=null, entries={}, cur, tab="dayoffs", brush="X", openSec="";
let cfgLoaded=false, loadErr="", pendingCfg=false, pendingMonth=null, cfgTimer=null, monthTimer=null, loadSeq=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const mkey=(y,m)=>`${y}-${pad(m)}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const mod=(a,n)=>((a%n)+n)%n;
const dnum=iso=>{const [y,m,d]=iso.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
{const t=new Date();cur={y:t.getFullYear(),m:t.getMonth()+1};}
const h0=location.hash.slice(1); if(["schedule","dayoffs","setup"].includes(h0))tab=h0;
function setStatus(t,bad){const s=$("#status");s.textContent=t;s.classList.toggle("bad",!!bad)}
const num=(v,d)=>v===""||v==null||isNaN(Number(v))?d:Number(v);
const USUAL=["","X","O","C","S","M"], USUALW={"":"Any",X:"Off",O:"Open",C:"Close",S:"Straight",M:"Mid"};
function usualDay(s,d){const w=s.week||{};if(w[d]!=null&&w[d]!=="")return w[d];return (s.weekly||[]).includes(d)?"X":""}

// ======================= scheduling rules =======================
// Per store: openers (1 up to "most openers"), at least "closers" closers. Straight counts as opener and closer.
// Straight per person per Mon–Sun week: aim for sMin, avoid going over sMax.
// Mid-shift plan (Caloocan): each week of the cycle says how many mids each person gets.
function compute(){
  const {y,m}=cur, N=new Date(y,m,0).getDate();
  const stores=cfg.stores, staff=cfg.staff, set=cfg.settings||{};
  const sMin=num(set.sMin,1);
  const sById=Object.fromEntries(stores.map(s=>[s.id,s]));
  const byCode={}; stores.forEach(s=>{if(s.code)byCode[String(s.code).toUpperCase()]=s.id});
  const hols=(cfg.holidays||[]).filter(h=>h.date);
  const holOn=Object.fromEntries(hols.map(h=>[h.date,h]));
  const days=[], grid=staff.map(()=>[]);
  const cnt=staff.map(()=>({S:0,O:0,C:0,M:0,off:0,reg:0,spec:0,ov:0,bk:0,wk:{},mw:{}}));
  const storeDay=Object.fromEntries(stores.map(s=>[s.id,[]]));
  const midGiven={}; // store|week -> count
  const off0=(new Date(y,m-1,1).getDay()+6)%7, N_=Math.max(staff.length,1);
  for(let d=1;d<=N;d++){
    const dow=new Date(y,m-1,d).getDay(), iso=`${y}-${pad(m)}-${pad(d)}`, sun=dow===0;
    const hol=holOn[iso]||null, week=Math.floor((d-1+off0)/7), dayIdx=(dow+6)%7;
    days.push({d,dow,iso,hol,sun});
    const rot=i=>(i+d)%N_;
    const P=staff.map(s=>{
      let raw=String((entries[s.id]||{})[d]||"").trim().toUpperCase(), weekly=false, fixed="";
      const usual=usualDay(s,DOW[dow]);
      if(!raw&&usual==="X"){raw="X";weekly=true}
      else if(!raw&&usual)fixed=usual;
      if(raw==="W")raw="";
      const p={raw,base:null,forced:null,off:null,weekly,fixed:!!fixed};
      let mm;
      if(!sById[s.home])p.off="?";
      else if(!raw){p.base=s.home;if(fixed)p.forced=fixed}
      else if(raw.length===1&&LETTERS.includes(raw)){p.base=s.home;p.forced=raw}
      else if((mm=raw.match(/^([SOCM])-([A-Z0-9]+)$/))&&byCode[mm[2]]){p.base=byCode[mm[2]];p.forced=mm[1]}
      else if(byCode[raw])p.base=byCode[raw];
      else p.off=raw;
      return p;
    });
    const auto=i=>P[i].raw===""&&P[i].base===staff[i].home;
    const movable=i=>auto(i)&&!P[i].fixed;
    // holidays: regular and special rotate separately
    if(hol){
      const type=hol.type==="special"?"special":"regular";
      const ord=hols.filter(h=>(h.type==="special"?"special":"regular")===type&&h.date.slice(0,4)===String(y)&&h.date<iso).length;
      stores.forEach(st=>{
        if(st.holCrew===""||st.holCrew==null)return;
        const k=Number(st.holCrew);
        const el=staff.map((s,i)=>i).filter(i=>staff[i].home===st.id&&auto(i));
        const n=el.length; if(!n)return;
        const start=(ord*k)%n, keep=new Set();
        for(let j=0;j<Math.min(k,n);j++)keep.add(el[(start+j)%n]);
        el.forEach(i=>{if(!keep.has(i)){P[i].base=null;P[i].forced=null;P[i].off="H"}});
      });
    }
    // extras go to another store
    stores.forEach(st=>{
      if(!st.overflowTo||!sById[st.overflowTo]||st.maxOnDuty===""||st.maxOnDuty==null)return;
      const here=P.map((p,i)=>i).filter(i=>P[i].base===st.id);
      const extra=here.length-Number(st.maxOnDuty); if(extra<=0)return;
      here.filter(movable).sort((a,b)=>cnt[a].ov-cnt[b].ov||rot(a)-rot(b)).slice(0,extra).forEach(i=>{P[i].base=st.overflowTo;cnt[i].ov++});
    });
    // short store borrows from another store
    stores.forEach(st=>{
      if(!st.backupFrom||!sById[st.backupFrom])return;
      let short=num(st.minOnDuty,1)-P.filter(p=>p.base===st.id).length; if(short<=0)return;
      const src=sById[st.backupFrom], srcMin=num(src.minOnDuty,1);
      const pool=staff.map((s,i)=>i).filter(i=>staff[i].home===src.id&&movable(i)).sort((a,b)=>cnt[a].bk-cnt[b].bk||rot(a)-rot(b));
      for(const i of pool){if(short<=0)break;if(P.filter(p=>p.base===src.id).length-1<srcMin)break;P[i].base=st.id;cnt[i].bk++;short--;}
    });
    // shifts
    const shift=staff.map(()=>null);
    const wS=i=>cnt[i].wk[week]||0;
    stores.forEach(st=>{
      const minC=Math.max(1,num(st.closers,2)), maxO=Math.max(1,num(st.maxOpen,2));
      const w=P.map((p,i)=>i).filter(i=>P[i].base===st.id), n=w.length;
      let opens=0,closes=0;
      w.filter(i=>P[i].forced).forEach(i=>{const L=P[i].forced;shift[i]=L;if(L==="S"||L==="O")opens++;if(L==="S"||L==="C")closes++;});
      let free=w.filter(i=>!P[i].forced);
      // mid-shift plan
      const plan=st.mid&&Array.isArray(st.mid.weeks)&&st.mid.weeks.length&&st.mid.start?st.mid:null;
      let quota=null, wkey=null;
      if(plan){
        const wi=Math.floor((dnum(iso)-dnum(plan.start))/7), row=plan.weeks[mod(wi,plan.weeks.length)]||{};
        quota=row; wkey=st.id+"|"+wi;
        const firstOfWeek=Math.max(1,d-dayIdx), lastOfWeek=Math.min(N,d-dayIdx+6);
        const avail=lastOfWeek-firstOfWeek+1, daysLeft=lastOfWeek-d+1;
        const total=Object.values(row).reduce((a,b)=>a+Number(b||0),0);
        const target=Math.round(total*avail/7), given=midGiven[wkey]||0;
        const needO=Math.max(0,1-opens), needC=Math.max(0,minC-closes);
        if(n>=3&&target-given>0&&(target-given)/daysLeft>=0.5&&free.length-1>=needO+needC){
          const cand=free.filter(i=>Number(row[staff[i].id]||0)-(cnt[i].mw[wi]||0)>0)
            .sort((a,b)=>(Number(row[staff[b].id]||0)-(cnt[b].mw[wi]||0))-(Number(row[staff[a].id]||0)-(cnt[a].mw[wi]||0))||rot(a)-rot(b));
          if(cand.length){const i=cand[0];shift[i]="M";free=free.filter(x=>x!==i)}
        }
      }
      const k=free.length;
      if(k){
        const needO=Math.max(0,1-opens), needC=Math.max(0,minC-closes);
        let giveS=0;
        if(needO>0&&needC>0&&needO+needC>k) giveS=Math.min(k,needO+needC-k);
        else if(n>=3&&opens<maxO&&free.some(i=>wS(i)<sMin)) giveS=1;
        if(giveS){
          free.sort((a,b)=>wS(a)-wS(b)||cnt[a].S-cnt[b].S||rot(a)-rot(b));
          free.splice(0,giveS).forEach(i=>{shift[i]="S";opens++;closes++});
        }
        let nO=Math.max(0,1-opens);
        const nC=Math.max(0,minC-closes);
        if(n>=4&&opens+nO<maxO&&free.length-nO>nC)nO++;
        free.sort((a,b)=>cnt[a].O-cnt[b].O||rot(a)-rot(b));
        free.splice(0,Math.min(nO,free.length)).forEach(i=>{shift[i]="O";opens++});
        free.forEach(i=>{shift[i]="C";closes++});
      }
      // trainees never open alone
      const tr=i=>!!staff[i].trainee;
      let opn=w.filter(i=>shift[i]==="O"||shift[i]==="S"), trainAlone=false;
      if(opn.length&&opn.every(tr)){
        const t=opn.find(i=>!P[i].forced), sw=w.find(i=>!tr(i)&&!P[i].forced&&(shift[i]==="C"||shift[i]==="M"));
        if(t!=null&&sw!=null){const a=shift[t];shift[t]=shift[sw];shift[sw]=a}else trainAlone=true;
      }
      if(plan){const wi=Math.floor((dnum(iso)-dnum(plan.start))/7);w.forEach(i=>{if(shift[i]==="M"){cnt[i].mw[wi]=(cnt[i].mw[wi]||0)+1;midGiven[st.id+"|"+wi]=(midGiven[st.id+"|"+wi]||0)+1}})}
      let chk="";
      if(!n){if(staff.some(s=>s.home===st.id))chk="No staff"}
      else if(!opens)chk="No opener";
      else if(n>1&&closes<minC)chk="Need closer";
      else if(trainAlone)chk="Trainee alone";
      storeDay[st.id].push({n,chk,who:w.map(i=>[i,shift[i]])});
    });
    staff.forEach((s,i)=>{
      const p=P[i];
      if(p.base){const L=shift[i];cnt[i][L]++;if(L==="S")cnt[i].wk[week]=(cnt[i].wk[week]||0)+1;
        if(hol){hol.type==="special"?cnt[i].spec++:cnt[i].reg++}
        grid[i].push({k:L,store:p.base,disp:L+(p.base!==s.home?"-"+(sById[p.base].code||"?"):"")});}
      else{cnt[i].off++;grid[i].push({k:p.off==="H"?"H":p.off==="X"?"X":"L",store:null,disp:p.off,weekly:p.weekly})}
    });
  }
  return {N,days,grid,cnt,storeDay,sById};
}

const cls=x=>x.hol?"hol":x.sun?"sun":"";
function headRows(days,extra){
  return `<thead><tr><th class="name"></th>${days.map(x=>`<th class="${cls(x)}" title="${esc(x.hol?x.hol.name:"")}">${x.hol?(x.hol.type==="special"?"Spl":"Hol"):DOW[x.dow]}</th>`).join("")}${extra?extra(0):""}</tr>

}
function scheduleTable(R){
  const {days,grid,sById}=R, staff=cfg.staff, rows=[];
  cfg.stores.forEach(st=>{
    rows.push([st.name,...days.map(x=>x.hol?(x.hol.type==="special"?"SPECIAL HOL":"REG HOL"):DOW[x.dow])]);
    rows.push([`${MONTHS[cur.m-1].toUpperCase()} ${cur.y}`,...days.map(x=>x.d)]);
    staff.forEach((s,i)=>{const home=s.home===st.id;
      if(!home&&!grid[i].some(c=>c.store===st.id))return;
      rows.push([s.name+(home?"":` (${sById[s.home]?.name||""})`),...grid[i].map(c=>home?c.disp:(c.store===st.id?c.k:""))]);});
    rows.push([""]);
  });
  return rows;
}
function ruleText(st){
  const c=num(st.closers,2), o=num(st.maxOpen,2);
  return `${o>1?"1–2 opening":"1 opening"}, ${c} closing${st.mid&&st.mid.weeks&&st.mid.weeks.length?", mid shift rotation":""}`;
}

      if(t.dataset.f){let v=t.value.trim();if(t.dataset.f==="name"||t.dataset.f==="code")v=v.toUpperCase();
        if(t.dataset.f==="code"&&/^(S|O|C|M|X|W|H|VL|SL)$/.test(v)){t.value=st.code;return}
        if(v===st.id)v="";st[t.dataset.f]=v;if(t.tagName==="INPUT")t.value=v;}
      if(t.dataset.n)st[t.dataset.n]=t.value===""?"":Number(t.value);
      if(t.dataset.mid)st.mid.start=t.value;
      if(t.dataset.mw!=null)st.mid.weeks[+t.dataset.mw][t.dataset.sid]=Number(t.value||0);
      saveCfg();}
  });
  m.addEventListener("click",e=>{const t=e.target, box=t.closest("[data-kind]");
    if(t.dataset.train&&box){const s=cfg.staff[+box.dataset.i];s.trainee=!s.trainee;t.setAttribute("aria-pressed",s.trainee);t.textContent=s.trainee?"Yes, can't open alone":"No";saveCfg();return}
    const wb=e.target.closest("button[data-wk]");
    if(wb&&box){const s=cfg.staff[+box.dataset.i],d=wb.dataset.wk;s.week=s.week||{};(s.weekly||[]).forEach(x=>{if(s.week[x]==null)s.week[x]="X"});s.weekly=[];
      const v=USUAL[(USUAL.indexOf(usualDay(s,d))+1)%USUAL.length];s.week[d]=v;
      wb.className="uw"+(v?" k-"+v:"");wb.querySelector("small").textContent=USUALW[v];wb.setAttribute("aria-label",d+": "+USUALW[v]);saveCfg();return}
    if(t.dataset.del&&box){const kind=box.dataset.kind,i=+box.dataset.i;
      if(kind==="hol"){cfg.holidays.splice(i,1);saveCfg();render();return}
      if(kind==="store"&&cfg.staff.some(s=>s.home===cfg.stores[i].id)){box.querySelector(".delwrap").innerHTML=`<span class="hint">Move this store's staff to another store first.</span>`;return}
      const nm=kind==="staff"?cfg.staff[i].name:cfg.stores[i].name;
      box.querySelector(".delwrap").innerHTML=`<span class="inline-confirm">Remove ${esc(nm)}? <button class="btn danger" data-yes="1">Yes, remove</button><button class="btn" data-no="1">No</button></span>`;return}
    if(t.dataset.yes&&box){const i=+box.dataset.i;if(box.dataset.kind==="staff")cfg.staff.splice(i,1);else{const id=cfg.stores[i].id;cfg.stores.splice(i,1);cfg.stores.forEach(s=>{if(s.overflowTo===id)s.overflowTo="";if(s.backupFrom===id)s.backupFrom=""})}saveCfg();render();return}
    if(t.dataset.no){render();return}
    if(box&&box.dataset.kind==="store"){const st=cfg.stores[+box.dataset.i];
      if(t.dataset.midon){const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));st.mid={start:`${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`,weeks:[{}]};saveCfg();render();return}
      if(t.dataset.midadd){st.mid.weeks.push({});saveCfg();render();return}
      if(t.dataset.midrm){st.mid.weeks.pop();saveCfg();render();return}
      if(t.dataset.midoff){delete st.mid;saveCfg();render();return}}
  });
  const add=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn};
  add("addstaff",()=>{if(!cfg.stores.length)return;const s={id:uid(),name:"NEW PERSON",home:cfg.stores[0].id,week:{}};cfg.staff.push(s);saveCfg();render();const el=document.getElementById("sn-"+s.id);if(el){el.focus();el.select()}});
  add("addstore",()=>{cfg.stores.push({id:uid(),name:"NEW STORE",code:"N",maxOpen:2,closers:2,holCrew:"",maxOnDuty:"",overflowTo:"",minOnDuty:"",backupFrom:""});saveCfg();render()});
  add("addhol",()=>{cfg.holidays.push({date:`${cur.y}-${pad(cur.m)}-01`,name:"New holiday",type:"regular"});saveCfg();render()});
}

function render(){
  $("#mlabel").textContent=`${MONTHS[cur.m-1]} ${cur.y}`;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const old=$("#main"), fresh=old.cloneNode(false); old.replaceWith(fresh);
  if(tab==="setup")return renderSetup();
  if(!conn.url){fresh.innerHTML=`<div class="empty"><b>First, connect your Google Sheet</b>Tap <b>Setup</b> above, then open "Google Sheet connection".</div>`;return}
  if(!cfgLoaded){fresh.innerHTML=loadErr?`<div class="empty"><b>Couldn't open your roster</b>${esc(loadErr)} Check the link in Setup.</div>`:`<div class="empty"><b>Loading your roster</b>Getting your stores, staff and day offs from Google Sheets.</div>`;return}
  if(!cfg.stores.length){fresh.innerHTML=`<div class="empty"><b>No stores yet</b>Add your stores and staff in Setup.</div>`;return}
  (tab==="schedule"?renderSchedule:renderDayoffs)();
}

// ======================= Google Sheet storage =======================
async function api(body){
  const r=await fetch(conn.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin:conn.pin})});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||"Save failed"); return j;
}
async function loadAll(first){
  if(!conn.url){render();return}
  const seq=++loadSeq, k=mkey(cur.y,cur.m);
  setStatus("Loading…");
  try{
    const j=await api({action:"load",month:k});
    if(seq!==loadSeq)return;
    const c=j.config||{};
    if(!pendingCfg)cfg={stores:c.stores||[],staff:c.staff||[],holidays:c.holidays||[],settings:c.settings||{sMin:1,sMax:2}};
    if(pendingMonth!==k)entries=(j.month&&j.month.entries)||{};
    cfgLoaded=true;loadErr="";setStatus("Saved ✓");
    if(first&&tab==="setup"&&openSec==="connect")tab="dayoffs";
  }catch(e){if(seq!==loadSeq)return;loadErr=/fetch/i.test(String(e.message||e))?"The sheet couldn't be reached.":String(e.message||e);setStatus("Not connected",true)}
  render();
}
function saveCfg(){
  pendingCfg=true;setStatus("Saving…");clearTimeout(cfgTimer);
  cfgTimer=setTimeout(async()=>{try{await api({action:"saveConfig",config:cfg});pendingCfg=false;setStatus("Saved ✓");saveMonth(true)}catch(e){pendingCfg=false;setStatus("Not saved!",true)}},900);
}
function saveMonth(quiet){
  const k=mkey(cur.y,cur.m);
  pendingMonth=k;if(!quiet)setStatus("Saving…");clearTimeout(monthTimer);
  monthTimer=setTimeout(()=>flushMonth(k),900);
}
async function flushMonth(k){
  const snap=JSON.parse(JSON.stringify(entries));
  let table=null; try{table=scheduleTable(compute())}catch(e){}
  try{await api({action:"saveMonth",month:k,entries:snap,table});if(pendingMonth===k)pendingMonth=null;setStatus("Saved ✓")}
  catch(e){pendingMonth=null;setStatus("Not saved!",true)}
}
function step(dir){
  if(pendingMonth){clearTimeout(monthTimer);flushMonth(pendingMonth)}
  let m=cur.m+dir,y=cur.y;if(m<1){m=12;y--}if(m>12){m=1;y++}cur={y,m};entries={};
  render();loadAll();
}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;history.replaceState(null,"","#"+tab);render()};
window.addEventListener("focus",()=>{if(cfgLoaded&&!pendingCfg&&!pendingMonth&&!document.activeElement.closest?.("main"))loadAll()});
window.addEventListener("resize",setHdr);
if(!conn.url){tab="setup";openSec="connect"}
render();loadAll(true);
})();
</script>
