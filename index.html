<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TFTG Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Shift board. Colours follow the clock: Opening = sunrise, Mid = noon sky, Closing = dusk, Straight = sunrise to dusk. */
:root{
  --bg:#edf0f5; --panel:#ffffff; --ink:#1a2238; --muted:#596381; --line:#d3d9e5; --soft:#e7ebf2;
  --accent:#2346c8; --accent-ink:#ffffff; --mark:#f0a020;
  --o:#ffe2a1; --o-ink:#6a4300; --m:#cbe9ff; --m-ink:#0b4a72; --c:#d8d0ff; --c-ink:#3a2a8c;
  --s:linear-gradient(90deg,#ffe2a1 0%,#ffd2c2 50%,#d8d0ff 100%); --s-ink:#1a2238;
  --x:#e2e6ee; --x-ink:#47506a; --h:#ffd3dc; --h-ink:#8a1d33; --mv:#cdf1e7; --mv-ink:#0d5a4a;
  --a:#d33a3a; --a-ink:#ffffff; --hol:#fff6dc; --sun:#f3f1fa;
  --bad:#c42b33; --bad-ink:#ffffff;
  --f:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-display:var(--f); --f-body:var(--f); --f-mono:var(--f);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10141f; --panel:#181e2d; --ink:#e6eaf4; --muted:#9aa3bd; --line:#2b3348; --soft:#20283a;
  --accent:#7d97ff; --accent-ink:#0b1022; --mark:#f5b443;
  --o:#5a4312; --o-ink:#ffe2a1; --m:#14425f; --m-ink:#cbe9ff; --c:#37296e; --c-ink:#ded7ff;
  --s:linear-gradient(90deg,#5a4312 0%,#5a2f3a 50%,#37296e 100%); --s-ink:#fff4e0;
  --x:#2a3245; --x-ink:#c3cadb; --h:#55222d; --h-ink:#ffc9d3; --mv:#16473d; --mv-ink:#bff3e3;
  --a:#e5545b; --a-ink:#1a0506; --hol:#2e2a1a; --sun:#1d2234;
  --bad:#ff6b72; --bad-ink:#1a0506; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
[hidden]{display:none!important}
button{font-family:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 10px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:34px;height:14px;border-radius:7px;background:var(--s);box-shadow:inset 0 0 0 1px rgba(26,34,56,.12)}
.month{display:flex;align-items:center;gap:8px;margin-left:auto}
.month h2{font-weight:800;font-size:1.45rem;letter-spacing:-.025em;margin:0;min-width:10ch;text-align:center}
.status{font-size:.8rem;color:var(--muted);min-width:9ch;text-align:right;font-weight:600}
.status.bad{color:var(--bad)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:10px}
nav button{border:0;background:var(--soft);color:var(--ink);font-weight:700;font-size:1rem;padding:11px 8px;border-radius:12px;cursor:pointer}
nav button span{display:block;font-weight:500;font-size:.76rem;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
nav button[aria-selected="true"] span{color:var(--panel);opacity:.75}
main{padding-block:18px 64px;display:grid;gap:16px}
main>*{min-width:0}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:.95rem;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.big{font-size:1.4rem;padding:4px 14px;line-height:1;border-radius:50%;width:44px;padding:0}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.say{font-size:1.05rem;margin:0;max-width:70ch}
.hint{color:var(--muted);font-size:.9rem;max-width:75ch;margin:0}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;font-weight:700;font-size:.78rem;padding:3px 7px;border-radius:7px;font-style:normal}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k-S{background:var(--s);color:var(--s-ink)} .k-O{background:var(--o);color:var(--o-ink)} .k-C{background:var(--c);color:var(--c-ink)} .k-M{background:var(--m);color:var(--m-ink)}
.k-X,.k-L{background:var(--x);color:var(--x-ink)} .k-H{background:var(--h);color:var(--h-ink)} .k-V{background:var(--mv);color:var(--mv-ink)} .k-A{background:var(--a);color:var(--a-ink)}
.chg{box-shadow:0 0 0 2px var(--ink) inset}
.changes{background:var(--panel);border-left:6px solid var(--a);border-radius:12px;padding:14px 16px}
.changes h3{margin:0 0 6px;font-size:1.05rem} .changes ul{margin:0;padding-left:1.1em} .changes li{margin:4px 0}
/* view switch */
.viewbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.95rem;padding:8px 18px;border-radius:9px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(26,34,56,.18)}
.viewbar .sub{display:inline-flex;align-items:center;gap:8px}
.viewbar .sub b{font-size:1.05rem;min-width:9ch;text-align:center}
.viewbar .sub .btn{width:44px;padding:0;font-size:1.2rem}
.strip{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip button{flex:0 0 auto;width:44px;border:0;border-radius:10px;background:var(--panel);color:var(--ink);font-weight:700;font-size:.95rem;padding:5px 0;cursor:pointer;display:grid;line-height:1.15}
.strip button small{font-size:.66rem;font-weight:600;color:var(--muted)}
.strip button.sun{background:var(--sun)} .strip button.hol{background:var(--hol)}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--panel)} .strip button[aria-pressed="true"] small{color:var(--panel)}
/* brushes */
.brushes{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,150px));z-index:4;box-shadow:0 6px 16px -12px rgba(26,34,56,.35)}
.brow{display:flex;flex-wrap:wrap;gap:8px}
.brush{border:3px solid transparent;border-radius:12px;font-weight:700;font-size:.95rem;padding:8px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.brush.erase{background:var(--bg);color:var(--ink);border-color:var(--line)}
.brush.erase[aria-pressed="true"]{border-color:var(--ink)}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}
details.more[open] summary{margin-bottom:8px}
/* store boards */
.store{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.store h3{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:0;padding:14px 16px 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.store h3 .rule{font-weight:500;font-size:.82rem;color:var(--muted)}
.store h3 .warn{margin-left:auto;font-weight:700;font-size:.82rem;color:var(--bad)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--soft);text-align:center;padding:0;height:36px;min-width:42px;font-size:.8rem}
.grid thead th{font-weight:600;color:var(--muted);background:var(--panel)}
.grid thead tr:first-child th{font-size:.7rem;padding-top:4px}
.grid thead tr:last-child th{color:var(--ink);font-weight:800;font-size:.9rem;border-bottom:1px solid var(--line)}
.grid .name{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;padding:0 12px;min-width:120px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:.9rem;border-right:1px solid var(--line)}
.grid .name em{font-style:normal;font-weight:500;color:var(--muted);font-size:.74rem}
.grid tr.storehead td{background:var(--soft);font-weight:800;font-size:.85rem;text-align:left;padding:7px 12px;height:auto}
.grid tr.storehead td.name{background:var(--soft)}
.grid .hol{background:var(--hol)} .grid .sun{background:var(--sun)}
.grid thead .hol{color:#b06e00}
.cell{display:flex;align-items:center;justify-content:center;height:28px;margin:4px 2px;border-radius:7px;font-weight:700;font-size:.76rem}
.grid tr.sub td{color:var(--muted);font-size:.74rem;height:26px}
.grid tr.sub td.name{font-weight:600}
.flag{display:inline-block;background:var(--bad);color:var(--bad-ink);font-weight:700;font-size:.6rem;padding:2px 3px;border-radius:4px;line-height:1.1;writing-mode:vertical-rl;transform:rotate(180deg);max-height:64px}
.grid tr.chk td{height:auto;padding-block:3px}
.grid td.tot{font-weight:700;min-width:38px}
.grid .first{border-left:1px solid var(--line)}
.week .grid th,.week .grid td{min-width:64px}
.week .cell{margin:4px 5px}
:where(button.dc){width:36px;height:34px;margin:2px;border:1.5px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);font-weight:700;font-size:.74rem;cursor:pointer;padding:0}
.week button.dc{width:56px}
button.dc:hover{border-color:var(--accent);border-style:solid}
button.dc.has{border-style:solid;border-color:transparent}
button.dc.wk{background:repeating-linear-gradient(135deg,var(--x),var(--x) 3px,transparent 3px,transparent 7px);color:var(--x-ink)}
button.dc.hd{background:repeating-linear-gradient(135deg,var(--h),var(--h) 3px,transparent 3px,transparent 7px);color:var(--h-ink)}
button.dc.chg:not(.has){border:2px solid var(--ink)}
/* day list (Day offs, day view) */
.dlist{display:grid;padding:0 8px 8px}
.drow{display:grid;grid-template-columns:minmax(90px,1fr) auto minmax(110px,1.4fr);gap:12px;align-items:center;padding:6px 8px;border-top:1px solid var(--soft)}
.dname{font-weight:700}
.drow button.dc{width:84px;height:44px;font-size:.85rem}
.dres{font-size:.9rem;color:var(--muted)}
.dres .chip{font-size:.8rem;margin-right:4px}
/* day timeline (Schedule, day view) */
.tlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.timeline{padding:4px 16px 16px;display:grid;gap:6px}
.axis{display:grid;grid-template-columns:repeat(6,1fr);font-size:.75rem;font-weight:600;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:4px}
.axis span:nth-child(1){grid-column:1/3} .axis span:nth-child(2){grid-column:3/5;text-align:center} .axis span:nth-child(3){grid-column:5/7;text-align:right}
.lane{display:grid;grid-template-columns:repeat(6,1fr)}
.lane .seg2{border-radius:10px;padding:7px 10px;display:grid;gap:1px;min-width:0}
.lane .seg2 small{font-size:.72rem;font-weight:600;opacity:.8}
.lane .seg2 b{font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.lane-S .seg2{grid-column:1/7} .lane-O .seg2{grid-column:1/4} .lane-M .seg2{grid-column:2/6} .lane-C .seg2{grid-column:4/7}
.offline{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.offline b{color:var(--ink);font-weight:600}
.store .warnline{margin:0 16px 12px;color:var(--bad);font-weight:700;font-size:.9rem}
/* today */
.today{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--mark);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.today h3{font-weight:800;margin:0;font-size:1.2rem;letter-spacing:-.01em}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tstore{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;min-width:0}
.tstore b{font-weight:800}
.tline{display:flex;gap:8px;align-items:baseline;font-size:.92rem}
.tline .chip{min-width:72px}
/* setup */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px}
details.sec>summary{cursor:pointer;padding:16px;font-weight:800;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::after{content:"Open";font-weight:700;font-size:.85rem;color:var(--accent)}
details.sec[open]>summary::after{content:"Close"}
details.sec>summary small{font-weight:500;font-size:.85rem;color:var(--muted);display:block}
.secbody{padding:0 16px 16px;display:grid;gap:14px}
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
input.t,select.t{font:500 1rem var(--f);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;min-height:44px}
input.t.num{width:7ch}
input.t.code{width:7ch;text-transform:uppercase}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-weight:700;font-size:.78rem;width:40px;height:40px;border-radius:9px;cursor:pointer}
.days button.uw{width:58px;height:52px;display:grid;place-content:center;gap:1px;line-height:1.1}
button[data-train][aria-pressed="true"]{background:var(--o);color:var(--o-ink);border-color:var(--o-ink)}
.days button.uw small{font-size:.68rem;font-weight:600}
.days button.uw[class*="k-"]{border-color:transparent}
.subcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px}
.subcard h4{margin:0;font-weight:800}
.midtable{border-collapse:collapse}
.midtable th,.midtable td{padding:4px 6px;text-align:center;font-size:.85rem}
.midtable th:first-child,.midtable td:first-child{text-align:left;font-weight:700}
.inline-confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:8px;max-width:75ch}
code{font-size:.85em;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (max-width:560px){.month{margin-left:0;width:100%;justify-content:space-between}.status{min-width:0}.brushes{position:static}.tlgrid{grid-template-columns:1fr}.drow{grid-template-columns:1fr auto}.dres{grid-column:1/-1;margin-top:-4px}}
@media (prefers-reduced-motion:no-preference){.seg button,.strip button,nav button{transition:background-color .15s,color .15s}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap">
    <div class="bar">
      <div class="brand">TFTG Roster</div>
      <div class="month">
        <button class="btn big" id="prev" aria-label="Previous month">‹</button>
        <h2 id="mlabel">—</h2>
        <button class="btn big" id="next" aria-label="Next month">›</button>
        <span class="status" id="status"></span>
      </div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="dayoffs">1. Day offs<span>Tap who is off</span></button>
      <button role="tab" data-tab="schedule">2. Schedule<span>See who works</span></button>
      <button role="tab" data-tab="setup">Setup<span>Staff, stores, holidays</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty"><b>Loading your roster</b>Your stores, staff and day offs will appear here.</div>
</main>

<script>
(()=>{
"use strict";
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const LETTERS="SOCM";
const WORD={S:"Straight",O:"Opening",C:"Closing",M:"Mid shift",X:"Day off",H:"Holiday off",VL:"Vacation leave",SL:"Sick leave",AB:"Absent"};
const DEFAULT_CFG={"stores":[{"id":"asc","name":"ASCOMO","code":"A","holCrew":2,"maxOnDuty":2,"overflowTo":"flo","minOnDuty":1,"backupFrom":"res","maxOpen":1,"closers":1},{"id":"flo","name":"FLORIDA","code":"F","holCrew":2,"maxOnDuty":"","overflowTo":"","minOnDuty":"","backupFrom":"","maxOpen":2,"closers":2},{"id":"por","name":"PORAC","code":"P","holCrew":2,"maxOnDuty":"","overflowTo":"","minOnDuty":"","backupFrom":"","maxOpen":2,"closers":2},{"id":"res","name":"RESETTLE","code":"R","holCrew":1,"maxOnDuty":"","overflowTo":"","minOnDuty":1,"backupFrom":"","maxOpen":1,"closers":1},{"id":"cal","name":"CALOOCAN","code":"CAL","holCrew":2,"maxOnDuty":"","overflowTo":"","minOnDuty":"","backupFrom":"","maxOpen":1,"closers":1,"mid":{"start":"2026-11-02","weeks":[{"lala":2,"lee":1,"jr":1},{"lala":1,"lee":2,"jr":1},{"lala":1,"lee":1,"jr":2}]}}],"staff":[{"id":"jerald","name":"JERALD","home":"asc","week":{}},{"id":"arjay","name":"ARJAY","home":"asc","week":{}},{"id":"carmi","name":"CARMI","home":"flo","week":{}},{"id":"kate","name":"KATE","home":"flo","week":{}},{"id":"bryan","name":"BRYAN","home":"asc","week":{}},{"id":"sarah","name":"SARAH","home":"por","week":{}},{"id":"marnella","name":"MARNELLA","home":"por","week":{}},{"id":"jomel","name":"JOMEL","home":"por","week":{"Mon":"","Tue":"C","Wed":"O","Thu":"C","Fri":"C","Sat":"O","Sun":"X"}},{"id":"jenny","name":"JENNY","home":"por","week":{},"trainee":true},{"id":"jun","name":"JUN","home":"res","week":{}},{"id":"jonas","name":"JONAS","home":"res","week":{}},{"id":"lala","name":"LALA","home":"cal","week":{}},{"id":"lee","name":"LEE","home":"cal","week":{}},{"id":"jr","name":"JR","home":"cal","week":{}}],"holidays":[{"date":"2026-01-01","name":"New Year's Day","type":"regular"},{"date":"2026-02-17","name":"Chinese New Year","type":"special"},{"date":"2026-03-20","name":"Eid'l Fitr","type":"regular"},{"date":"2026-04-02","name":"Maundy Thursday","type":"regular"},{"date":"2026-04-03","name":"Good Friday","type":"regular"},{"date":"2026-04-04","name":"Black Saturday","type":"special"},{"date":"2026-04-09","name":"Araw ng Kagitingan","type":"regular"},{"date":"2026-05-01","name":"Labor Day","type":"regular"},{"date":"2026-06-12","name":"Independence Day","type":"regular"},{"date":"2026-08-21","name":"Ninoy Aquino Day","type":"special"},{"date":"2026-08-31","name":"National Heroes Day","type":"regular"},{"date":"2026-11-01","name":"All Saints' Day","type":"special"},{"date":"2026-11-02","name":"All Souls' Day","type":"special"},{"date":"2026-11-30","name":"Bonifacio Day","type":"regular"},{"date":"2026-12-08","name":"Immaculate Conception","type":"special"},{"date":"2026-12-24","name":"Christmas Eve","type":"special"},{"date":"2026-12-25","name":"Christmas Day","type":"regular"},{"date":"2026-12-30","name":"Rizal Day","type":"regular"},{"date":"2026-12-31","name":"Last Day of the Year","type":"special"}],"settings":{"sMin":1,"sMax":2}};
const LSC="tftg-roster-config", LSM="tftg-roster-month:";
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LS="tftg-roster-settings";
let conn={url:"",pin:""};
try{conn=Object.assign(conn,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
let cfg=null, entries={}, cur, tab="dayoffs", brush="X", openSec="", view="month", fd=0;
let cfgLoaded=false, loadErr="", pendingCfg=false, pendingMonth=null, cfgTimer=null, monthTimer=null, loadSeq=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const mkey=(y,m)=>`${y}-${pad(m)}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const mod=(a,n)=>((a%n)+n)%n;

const num=(v,d)=>v===""||v==null||isNaN(Number(v))?d:Number(v);
const USUAL=["","X","O","C","S","M"], USUALW={"":"Any",X:"Off",O:"Open",C:"Close",S:"Straight",M:"Mid"};
function usualDay(s,d){const w=s.week||{};if(w[d]!=null&&w[d]!=="")return w[d];return (s.weekly||[]).includes(d)?"X":""}

// ======================= scheduling rules =======================
// Per store: openers (1 up to "most openers"), at least "closers" closers. Straight counts as opener and closer.
// Straight per person per Mon–Sun week: aim for sMin, avoid going over sMax.
// Mid-shift plan (Caloocan): each week of the cycle says how many mids each person gets.
function calc(noAbs){
  const {y,m}=cur, N=new Date(y,m,0).getDate();
  const stores=cfg.stores, staff=cfg.staff, set=cfg.settings||{};
  const sMin=num(set.sMin,1);
  const sById=Object.fromEntries(stores.map(s=>[s.id,s]));
  const byCode={}; stores.forEach(s=>{if(s.code)byCode[String(s.code).toUpperCase()]=s.id});
  const hols=(cfg.holidays||[]).filter(h=>h.date);
  const holOn=Object.fromEntries(hols.map(h=>[h.date,h]));
  const days=[], grid=staff.map(()=>[]);
  const cnt=staff.map(()=>({S:0,O:0,C:0,M:0,off:0,reg:0,spec:0,ov:0,bk:0,wk:{},mw:{}}));
  const storeDay=Object.fromEntries(stores.map(s=>[s.id,[]]));
  const midGiven={}; // store|week -> count
  const off0=(new Date(y,m-1,1).getDay()+6)%7, N_=Math.max(staff.length,1);
  for(let d=1;d<=N;d++){
    const dow=new Date(y,m-1,d).getDay(), iso=`${y}-${pad(m)}-${pad(d)}`, sun=dow===0;
    const hol=holOn[iso]||null, week=Math.floor((d-1+off0)/7), dayIdx=(dow+6)%7;
    days.push({d,dow,iso,hol,sun});
    const rot=i=>(i+d)%N_;
    const P=staff.map(s=>{
      let raw=String((entries[s.id]||{})[d]||"").trim().toUpperCase(), weekly=false, fixed="";
      if(raw==="AB"&&noAbs)raw="";
      const usual=usualDay(s,DOW[dow]);
      if(!raw&&usual==="X"){raw="X";weekly=true}
      else if(!raw&&usual)fixed=usual;
      if(raw==="W")raw="";
      const p={raw,base:null,forced:null,off:null,weekly,fixed:!!fixed};
      let mm;
      if(!sById[s.home])p.off="?";
      else if(!raw){p.base=s.home;if(fixed)p.forced=fixed}
      else if(raw.length===1&&LETTERS.includes(raw)){p.base=s.home;p.forced=raw}
      else if(raw==="AB")p.off="AB";
      else if((mm=raw.match(/^([SOCM])-([A-Z0-9]+)$/))&&byCode[mm[2]]){p.base=byCode[mm[2]];p.forced=mm[1]}
      else if(byCode[raw])p.base=byCode[raw];
      else p.off=raw;
      return p;
    });
    const auto=i=>P[i].raw===""&&P[i].base===staff[i].home;
    const movable=i=>auto(i)&&!P[i].fixed;
    // holidays: regular and special rotate separately
    if(hol){
      const type=hol.type==="special"?"special":"regular";
      const ord=hols.filter(h=>(h.type==="special"?"special":"regular")===type&&h.date.slice(0,4)===String(y)&&h.date<iso).length;
      stores.forEach(st=>{
        if(st.holCrew===""||st.holCrew==null)return;
        const k=Number(st.holCrew);
        const el=staff.map((s,i)=>i).filter(i=>staff[i].home===st.id&&auto(i));
        const n=el.length; if(!n)return;
        const start=(ord*k)%n, keep=new Set();
        for(let j=0;j<Math.min(k,n);j++)keep.add(el[(start+j)%n]);
        el.forEach(i=>{if(!keep.has(i)){P[i].base=null;P[i].forced=null;P[i].off="H"}});
      });
    }
    // extras go to another store
    stores.forEach(st=>{
      if(!st.overflowTo||!sById[st.overflowTo]||st.maxOnDuty===""||st.maxOnDuty==null)return;
      const here=P.map((p,i)=>i).filter(i=>P[i].base===st.id);
      const extra=here.length-Number(st.maxOnDuty); if(extra<=0)return;
      here.filter(movable).sort((a,b)=>cnt[a].ov-cnt[b].ov||rot(a)-rot(b)).slice(0,extra).forEach(i=>{P[i].base=st.overflowTo;cnt[i].ov++});
    });
    // short store borrows from another store
    stores.forEach(st=>{
      if(!st.backupFrom||!sById[st.backupFrom])return;
      let short=num(st.minOnDuty,1)-P.filter(p=>p.base===st.id).length; if(short<=0)return;
      const src=sById[st.backupFrom], srcMin=num(src.minOnDuty,1);
      const pool=staff.map((s,i)=>i).filter(i=>staff[i].home===src.id&&movable(i)).sort((a,b)=>cnt[a].bk-cnt[b].bk||rot(a)-rot(b));
      for(const i of pool){if(short<=0)break;if(P.filter(p=>p.base===src.id).length-1<srcMin)break;P[i].base=st.id;cnt[i].bk++;short--;}
    });
    // shifts
    const shift=staff.map(()=>null);
    const wS=i=>cnt[i].wk[week]||0;
    stores.forEach(st=>{
      const minC=Math.max(1,num(st.closers,2)), maxO=Math.max(1,num(st.maxOpen,2));
      const w=P.map((p,i)=>i).filter(i=>P[i].base===st.id), n=w.length;
      let opens=0,closes=0;
      w.filter(i=>P[i].forced).forEach(i=>{const L=P[i].forced;shift[i]=L;if(L==="S"||L==="O")opens++;if(L==="S"||L==="C")closes++;});
      let free=w.filter(i=>!P[i].forced);
      // mid-shift plan
      const plan=st.mid&&Array.isArray(st.mid.weeks)&&st.mid.weeks.length&&st.mid.start?st.mid:null;
      let quota=null, wkey=null;
      if(plan){
        const wi=Math.floor((dnum(iso)-dnum(plan.start))/7), row=plan.weeks[mod(wi,plan.weeks.length)]||{};
        quota=row; wkey=st.id+"|"+wi;
        const firstOfWeek=Math.max(1,d-dayIdx), lastOfWeek=Math.min(N,d-dayIdx+6);
        const avail=lastOfWeek-firstOfWeek+1, daysLeft=lastOfWeek-d+1;
        const total=Object.values(row).reduce((a,b)=>a+Number(b||0),0);
        const target=Math.round(total*avail/7), given=midGiven[wkey]||0;
        const needO=Math.max(0,1-opens), needC=Math.max(0,minC-closes);
        if(n>=3&&target-given>0&&(target-given)/daysLeft>=0.5&&free.length-1>=needO+needC){
          const cand=free.filter(i=>Number(row[staff[i].id]||0)-(cnt[i].mw[wi]||0)>0)
            .sort((a,b)=>(Number(row[staff[b].id]||0)-(cnt[b].mw[wi]||0))-(Number(row[staff[a].id]||0)-(cnt[a].mw[wi]||0))||rot(a)-rot(b));
          if(cand.length){const i=cand[0];shift[i]="M";free=free.filter(x=>x!==i)}
        }
      }
      const k=free.length;
      if(k){
        const needO=Math.max(0,1-opens), needC=Math.max(0,minC-closes);
        let giveS=0;
        if(needO>0&&needC>0&&needO+needC>k) giveS=Math.min(k,needO+needC-k);
        else if(n>=3&&opens<maxO&&free.some(i=>wS(i)<sMin)) giveS=1;
        if(giveS){
          free.sort((a,b)=>wS(a)-wS(b)||cnt[a].S-cnt[b].S||rot(a)-rot(b));
          free.splice(0,giveS).forEach(i=>{shift[i]="S";opens++;closes++});
        }
        let nO=Math.max(0,1-opens);
        const nC=Math.max(0,minC-closes);
        if(n>=4&&opens+nO<maxO&&free.length-nO>nC)nO++;
        free.sort((a,b)=>cnt[a].O-cnt[b].O||rot(a)-rot(b));
        free.splice(0,Math.min(nO,free.length)).forEach(i=>{shift[i]="O";opens++});
        free.forEach(i=>{shift[i]="C";closes++});
      }
      // trainees never open alone
      const tr=i=>!!staff[i].trainee;
      let opn=w.filter(i=>shift[i]==="O"||shift[i]==="S"), trainAlone=false;
      if(opn.length&&opn.every(tr)){
        const t=opn.find(i=>!P[i].forced), sw=w.find(i=>!tr(i)&&!P[i].forced&&(shift[i]==="C"||shift[i]==="M"));
        if(t!=null&&sw!=null){const a=shift[t];shift[t]=shift[sw];shift[sw]=a}else trainAlone=true;
      }
      if(plan){const wi=Math.floor((dnum(iso)-dnum(plan.start))/7);w.forEach(i=>{if(shift[i]==="M"){cnt[i].mw[wi]=(cnt[i].mw[wi]||0)+1;midGiven[st.id+"|"+wi]=(midGiven[st.id+"|"+wi]||0)+1}})}
      let chk="";
      if(!n){if(staff.some(s=>s.home===st.id))chk="No staff"}
      else if(!opens)chk="No opener";
      else if(n>1&&closes<minC)chk="Need closer";
      else if(trainAlone)chk="Trainee alone";
      storeDay[st.id].push({n,chk,who:w.map(i=>[i,shift[i]])});
    });
    staff.forEach((s,i)=>{
      const p=P[i];
      if(p.base){const L=shift[i];cnt[i][L]++;if(L==="S")cnt[i].wk[week]=(cnt[i].wk[week]||0)+1;
        if(hol){hol.type==="special"?cnt[i].spec++:cnt[i].reg++}
        grid[i].push({k:L,store:p.base,disp:L+(p.base!==s.home?"-"+(sById[p.base].code||"?"):"")});}
      else{cnt[i].off++;grid[i].push({k:p.off==="H"?"H":p.off==="X"?"X":p.off==="AB"?"A":"L",store:null,disp:p.off,weekly:p.weekly})}
    });
  }
  return {N,days,grid,cnt,storeDay,sById};
}
// Absent: only the absent day is re-planned; every other day stays exactly as before.
function compute(){
  const absDays=new Set();
  Object.values(entries).forEach(e=>Object.entries(e).forEach(([d,v])=>{if(v==="AB")absDays.add(+d)}));
  const A=calc(false); A.changes=[];
  if(!absDays.size)return A;
  const B=calc(true), staff=cfg.staff, changes=[];
  const grid=B.grid.map((row,i)=>row.map((c,j)=>{
    if(!absDays.has(j+1))return c;
    const a=A.grid[i][j];
    return a.k!=="A"&&a.disp!==c.disp?{...a,chg:true,was:c.disp,wasCell:c}:a;}));
  const say=(c,s)=>(WORD[c.k]||c.disp)+(c.store&&c.store!==s.home?" at "+(A.sById[c.store]?.name||""):"");
  [...absDays].sort((a,b)=>a-b).forEach(d=>{
    const j=d-1, gone=[], moved=[];
    staff.forEach((s,i)=>{const c=grid[i][j];if(!c)return;if(c.k==="A")gone.push(s.name);else if(c.chg)moved.push(`${s.name}: ${say(c.wasCell,s)} → ${say(c,s)}`)});
    if(gone.length)changes.push({d,dow:A.days[j].dow,gone,moved});
  });
  const storeDay=Object.fromEntries(Object.keys(B.storeDay).map(k=>[k,B.storeDay[k].map((x,j)=>absDays.has(j+1)?A.storeDay[k][j]:x)]));
  const cnt=grid.map(row=>{const c={S:0,O:0,C:0,M:0,off:0,reg:0,spec:0};
    row.forEach((x,j)=>{if(x.store){c[x.k]++;const h=B.days[j].hol;if(h){h.type==="special"?c.spec++:c.reg++}}else c.off++});return c});
  return {...B,grid,storeDay,cnt,changes};
}

function scheduleTable(R){
  const {days,grid,sById}=R, staff=cfg.staff, rows=[];
  cfg.stores.forEach(st=>{
    rows.push([st.name,...days.map(x=>x.hol?(x.hol.type==="special"?"SPECIAL HOL":"REG HOL"):DOW[x.dow])]);
    rows.push([`${MONTHS[cur.m-1].toUpperCase()} ${cur.y}`,...days.map(x=>x.d)]);
    staff.forEach((s,i)=>{const home=s.home===st.id;
      if(!home&&!grid[i].some(c=>c.store===st.id))return;
      rows.push([s.name+(home?"":` (${sById[s.home]?.name||""})`),...grid[i].map(c=>home?c.disp:(c.store===st.id?c.k:""))]);});

}

// ======================= Month / Week / Day switch =======================
const VIEWS=[["month","Month"],["week","Week"],["day","Day"]];
const DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function defaultDay(){const t=new Date();return t.getFullYear()===cur.y&&t.getMonth()+1===cur.m?t.getDate():1}
function shown(days){
  const N=days.length; fd=Math.min(Math.max(1,fd||1),N);
  if(view==="day")return [fd-1];
  if(view==="week"){const [a,b]=weekRanges(days).find(([a,b])=>fd>=a&&fd<=b),r=[];for(let d=a;d<=b;d++)r.push(d-1);return r}
  return days.map((x,j)=>j);
}
// Mon–Sun weeks inside the month; a short first or last week (under 4 days) joins its neighbour.
function weekRanges(days){
  const N=days.length, R=[]; let a=1;
  for(let d=1;d<=N;d++)if(days[d-1].dow===0||d===N){R.push([a,d]);a=d+1}
  if(R.length>1&&R[0][1]-R[0][0]<3){R[1][0]=R[0][0];R.shift()}
  const L=R.length; if(L>1&&R[L-1][1]-R[L-1][0]<3){R[L-2][1]=R[L-1][1];R.pop()}
  return R;
}
function viewBar(days,idx){
  const a=days[idx[0]], b=days[idx[idx.length-1]], mon=MONTHS[cur.m-1];
  const label=view==="week"?`${mon.slice(0,3)} ${a.d}–${b.d}`:view==="day"?`${DOWL[a.dow]}, ${mon.slice(0,3)} ${a.d}`:"";
  return `<div class="viewbar"><div class="seg" role="group" aria-label="Show">${VIEWS.map(([v,l])=>`<button type="button" data-view="${v}" aria-pressed="${view===v}">${l}</button>`).join("")}</div>
  ${view!=="month"?`<div class="sub"><button class="btn" data-mv="-1" aria-label="Previous ${view}">‹</button><b>${label}</b><button class="btn" data-mv="1" aria-label="Next ${view}">›</button></div>`:""}
  ${view==="day"?`<div class="strip">${days.map(x=>`<button type="button" data-fd="${x.d}" class="${cls(x)}" aria-pressed="${x.d===fd}" aria-label="${DOWL[x.dow]} ${x.d}"><small>${DOW[x.dow].slice(0,2)}</small>${x.d}</button>`).join("")}</div>`:""}</div>`;
}
function bindViewBar(){
  $("#main").addEventListener("click",e=>{const b=e.target.closest(".viewbar button");if(!b)return;
    if(b.dataset.view){view=b.dataset.view;lsSet("tftg-view",view);if(view!=="month")fd=fd||defaultDay()}
    if(b.dataset.fd)fd=+b.dataset.fd;
    if(b.dataset.mv){const dir=Number(b.dataset.mv), N=new Date(cur.y,cur.m,0).getDate();
      if(view==="week"){const days=[];for(let d=1;d<=N;d++)days.push({dow:new Date(cur.y,cur.m-1,d).getDay()});
        const W=weekRanges(days), r=W.findIndex(([a,b])=>fd>=a&&fd<=b)+dir;
        if(r<0)return step(-1,0); if(r>=W.length)return step(1,1); fd=W[r][0];}
      else{const n=fd+dir; if(n<1)return step(-1,0); if(n>N)return step(1,1); fd=n;}}
    render();
    if(b.dataset.fd){const s=document.querySelector(`.strip button[data-fd="${fd}"]`);if(s)s.scrollIntoView({block:"nearest",inline:"center"})}
  });
}
function offWord(c){return c.weekly?"Usual day off":(WORD[c.disp]||WORD[c.k]||c.disp)}
function resultText(c,s){
  if(c.store)return `<i class="chip k-${c.k}${c.chg?" chg":""}">${WORD[c.k]}</i>${c.store!==s.home?" at "+esc(cfg.stores.find(x=>x.id===c.store)?.name||""):""}`;
  return `<i class="chip k-${c.k==="A"?"A":c.k==="H"?"H":"X"}">${esc(offWord(c))}</i>`;
}

// ======================= 1. Day offs =======================
function brushBtn(v,label,k){return `<button type="button" class="brush k-${k}" data-b="${esc(v)}" aria-pressed="${brush===v}">${esc(label)}</button>`}

  const R=compute(), {days,grid,cnt}=R, staff=cfg.staff, idx=shown(days), sub=idx.map(j=>days[j]);

        return `<div class="drow" data-row="${s.id}"><span class="dname">${esc(s.name)}</span>${cellBtn(s,x.d,e[x.d]||"",grid[i][j])}<span class="dres">${resultText(grid[i][j],s)}</span></div>`}).join("")}</div></section>`}).join("")}</div>`;

    cfg.stores.forEach(st=>{
      const ids=staff.map((s,i)=>i).filter(i=>staff[i].home===st.id); if(!ids.length)return;
      body+=`<tr class="storehead"><td class="name">${esc(st.name)}</td><td colspan="${sub.length+TOT.length}"></td></tr>`;
      body+=ids.map(i=>{const s=staff[i], e=entries[s.id]||{};
        return `<tr><td class="name" title="${esc(s.name)}">${esc(s.name)}</td>${idx.map(j=>`<td class="${cls(days[j])}">${cellBtn(s,days[j].d,e[days[j].d]||"",grid[i][j])}</td>`).join("")}${month?[cnt[i].off,cnt[i].S,cnt[i].O,cnt[i].C,cnt[i].M].map((v,k)=>`<td class="tot${k?"":" first"}">${v}</td>`).join(""):""}</tr>`}).join("");
    });
    board=`<div class="store${month?"":" week"}"><div class="scroll"><table class="grid">${headRows(sub,month?extra:null)}<tbody>${body}</tbody></table></div></div>`;
  }

  <div class="brushes" id="brushes">
    <p class="hint" style="color:var(--ink)"><b>Pick a button, then tap the boxes.</b> Tap a box again to remove it.</p>
    <div class="brow">${brushBtn("X","Day off","X")}${brushBtn("VL","Vacation leave","X")}${brushBtn("SL","Sick leave","X")}${brushBtn("AB","Absent today","A")}<button type="button" class="brush erase" data-b="" aria-pressed="${brush===""}">Eraser</button></div>
    <details class="more"${/^[A-Z]{1,3}$/.test(brush)&&!["X","VL","SL","AB"].includes(brush)||brush.includes("-")||brush==="W"?" open":""}><summary>More buttons</summary>
      <div class="brow">${cfg.stores.map(s=>brushBtn(String(s.code).toUpperCase(),"Work at "+s.name,"V")).join("")}</div>
      <div class="brow" style="margin-top:8px">${["O","C","S","M"].map(L=>brushBtn(L,"Must be "+WORD[L],L)).join("")}${brushBtn("W","Ignore usual week","X")}</div>
    </details>
  </div>
  ${board}
  <p class="hint">Striped boxes are already off: grey stripes are usual days off (set in Setup › Staff), pink stripes are holiday days off. <b>Absent today</b> is for someone who suddenly can't come: only that day is re-planned, and boxes with a dark border show who was moved to cover. Staff send requests in the last week of the month, so press <b>›</b> at the top to go to ${nextM} first.</p>
  <div class="tools"><span id="clearwrap"><button class="btn danger" id="clear">Clear all of ${MONTHS[cur.m-1]}</button></span></div>`;
  setHdr(); bindViewBar();
  $("#brushes").addEventListener("click",e=>{const b=e.target.closest(".brush");if(!b)return;brush=b.dataset.b;document.querySelectorAll(".brush").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#main").addEventListener("click",e=>{
    const t=e.target.closest("button.dc"); if(!t)return;
    const sid=t.dataset.s, d=t.dataset.d, old=(entries[sid]||{})[d]||"";
    const v=(brush===""||old===brush)?"":brush;
    entries[sid]=entries[sid]||{}; if(v)entries[sid][d]=v; else delete entries[sid][d];
    if(!Object.keys(entries[sid]).length)delete entries[sid];
    saveMonth(); refreshDayoffs();
  });
  $("#clear").onclick=()=>{$("#clearwrap").innerHTML=`<span class="inline-confirm">Remove every box you tapped in ${MONTHS[cur.m-1]}? <button class="btn danger" id="cy">Yes, clear</button><button class="btn" id="cn">No, keep</button></span>`;
    $("#cy").onclick=()=>{entries={};saveMonth();render()};$("#cn").onclick=render;};
}
function cellBtn(s,d,v,c){
  let k="",txt=v,extra="";
  if(v){k="has k-"+(v==="AB"?"A":v==="X"||v==="VL"||v==="SL"?"X":LETTERS.includes(v[0])&&(v.length===1||v[1]==="-")?v[0]:v==="W"?"X":"V")}
  else if(c&&c.weekly){extra=" wk";txt="X"}
  else if(c&&c.k==="H"){extra=" hd";txt="H"}
  else if(c&&c.chg){extra=" chg";txt=c.k}

function dayBoard(R,j){
  const {days,grid,storeDay,sById}=R, staff=cfg.staff;
  const LANES=[["S","Straight","open to close"],["O","Opening","morning"],["M","Mid shift","midday"],["C","Closing","until close"]];
  return `<div class="tlgrid">${cfg.stores.map(st=>{
    const sd=storeDay[st.id][j], who=sd.who;
    const nm=i=>esc(staff[i].name)+(staff[i].home!==st.id?` (${esc(sById[staff[i].home]?.name||"")})`:"");
    const lanes=LANES.map(([L,w,when])=>{const ppl=who.filter(x=>x[1]===L);if(!ppl.length)return "";
      return `<div class="lane lane-${L}"><div class="seg2 k-${L}"><small>${w} · ${when}</small><b>${ppl.map(x=>nm(x[0])+(grid[x[0]][j].chg?" ✱":"")).join(", ")}</b></div></div>`}).join("");
    const away=staff.map((s,i)=>i).filter(i=>staff[i].home===st.id&&grid[i][j].store!==st.id).map(i=>{const c=grid[i][j];
      return `<b>${esc(staff[i].name)}</b> ${c.store?"at "+esc(sById[c.store]?.name||""):offWord(c).toLowerCase()}`});
    return `<section class="store"><h3>${esc(st.name)} <span class="rule">${who.length} working</span></h3>
      ${sd.chk?`<p class="warnline">Needs help: ${esc(sd.chk)}</p>`:""}
      <div class="timeline">${who.length?`<div class="axis"><span>Open</span><span>Midday</span><span>Close</span></div>${lanes}`:`<p class="hint">Nobody works here today.</p>`}
      ${away.length?`<p class="offline">Not here: ${away.join(", ")}</p>`:""}${who.some(x=>grid[x[0]][j].chg)?`<p class="offline">✱ moved to cover an absent person</p>`:""}</div></section>`}).join("")}</div>`;

          if(!isHome&&c.store!==st.id)return `<td class="${cls(days[j])}"></td>`;
          return `<td class="${cls(days[j])}"><span class="cell k-${isHome&&c.store&&c.store!==st.id?"V":c.k}${c.chg?" chg":""}" title="${esc((WORD[c.k]||c.disp)+(c.chg?" (changed, was "+(WORD[c.wasCell.k]||c.was)+")":""))}">${esc(isHome?c.disp:c.k)}</span></td>`}).join("")}</tr>`}).join("");
      return `<section class="store${view==="week"?" week":""}"><h3>${esc(st.name)} <span class="rule">${ruleText(st)}</span>${nW?`<span class="warn">${nW} day${nW>1?"s":""} need help</span>`:""}</h3>

  <p class="say">${warn?`<b>${warn} problem${warn>1?"s":""}</b> ${span}: a store is missing an opener or closer. Fix it on the Day offs page by moving someone's day off.`:`<b>All good ${span}.</b> Every store has its openers and closers.`}</p>
  ${view==="day"?"":`<div class="legend"><span><i class="chip k-O">O</i>Opening</span><span><i class="chip k-M">M</i>Mid shift</span><span><i class="chip k-C">C</i>Closing</span><span><i class="chip k-S">S</i>Straight, open to close</span><span><i class="chip k-X">X</i>Day off</span><span><i class="chip k-H">H</i>Holiday off</span><span><i class="chip k-A">AB</i>Absent</span><span><i class="chip k-C chg">C</i>Changed to cover</span><span><i class="chip k-V">C-F</i>At another store (F = Florida)</span></div>`}
  ${blocks}
  <div class="tools"><button class="btn primary" id="copy">Copy ${MONTHS[cur.m-1]} schedule</button><span class="hint" id="copymsg">Paste it into Excel, Google Sheets or Messenger.</span></div>`;
  bindViewBar();
  $("#copy").onclick=()=>{
    const text=scheduleTable(R).map(r=>r.join("\t")).join("\n"), msg=$("#copymsg");
    const fb=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="width:100%;height:140px";msg.replaceWith(ta);ta.select()};

function bindSetup(set){
  const m=$("#main");
  m.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.sec")){if(d.open)openSec=d.dataset.sec;else if(openSec===d.dataset.sec)openSec=""}},true);
  $("#cf").addEventListener("submit",e=>{e.preventDefault();conn={url:$("#curl").value.trim(),pin:""};
    try{localStorage.setItem(LS,JSON.stringify(conn))}catch(err){}
    $("#cmsg").textContent="Connecting…";cfgLoaded=false;loadAll(true);});
  if(!cfgLoaded)return;
  m.addEventListener("change",e=>{const t=e.target;
    if(t.id==="smin"||t.id==="smax"){set[t.id==="smin"?"sMin":"sMax"]=Number(t.value||0);saveCfg();return}
    const box=t.closest("[data-kind]"); if(!box)return; const kind=box.dataset.kind, i=+box.dataset.i;
    if(kind==="staff"){const s=cfg.staff[i];s[t.dataset.f]=t.dataset.f==="name"?t.value.trim().toUpperCase():t.value;if(t.dataset.f==="name")t.value=s.name;saveCfg();}
    if(kind==="hol"){cfg.holidays[i][t.dataset.f]=t.value.trim();saveCfg();}
    if(kind==="store"){const st=cfg.stores[i];
      if(t.dataset.f){let v=t.value.trim();if(t.dataset.f==="name"||t.dataset.f==="code")v=v.toUpperCase();
        if(t.dataset.f==="code"&&/^(S|O|C|M|X|W|H|VL|SL|AB)$/.test(v)){t.value=st.code;return}
        if(v===st.id)v="";st[t.dataset.f]=v;if(t.tagName==="INPUT")t.value=v;}
      if(t.dataset.n)st[t.dataset.n]=t.value===""?"":Number(t.value);
      if(t.dataset.mid)st.mid.start=t.value;
      if(t.dataset.mw!=null)st.mid.weeks[+t.dataset.mw][t.dataset.sid]=Number(t.value||0);
      saveCfg();}
  });
  m.addEventListener("click",e=>{const t=e.target, box=t.closest("[data-kind]");
    if(t.dataset.train&&box){const s=cfg.staff[+box.dataset.i];s.trainee=!s.trainee;t.setAttribute("aria-pressed",s.trainee);t.textContent=s.trainee?"Yes, can't open alone":"No";saveCfg();return}
    const wb=e.target.closest("button[data-wk]");
    if(wb&&box){const s=cfg.staff[+box.dataset.i],d=wb.dataset.wk;s.week=s.week||{};(s.weekly||[]).forEach(x=>{if(s.week[x]==null)s.week[x]="X"});s.weekly=[];
      const v=USUAL[(USUAL.indexOf(usualDay(s,d))+1)%USUAL.length];s.week[d]=v;
      wb.className="uw"+(v?" k-"+v:"");wb.querySelector("small").textContent=USUALW[v];wb.setAttribute("aria-label",d+": "+USUALW[v]);saveCfg();return}
    if(t.dataset.del&&box){const kind=box.dataset.kind,i=+box.dataset.i;
      if(kind==="hol"){cfg.holidays.splice(i,1);saveCfg();render();return}
      if(kind==="store"&&cfg.staff.some(s=>s.home===cfg.stores[i].id)){box.querySelector(".delwrap").innerHTML=`<span class="hint">Move this store's staff to another store first.</span>`;return}
      const nm=kind==="staff"?cfg.staff[i].name:cfg.stores[i].name;
      box.querySelector(".delwrap").innerHTML=`<span class="inline-confirm">Remove ${esc(nm)}? <button class="btn danger" data-yes="1">Yes, remove</button><button class="btn" data-no="1">No</button></span>`;return}
    if(t.dataset.yes&&box){const i=+box.dataset.i;if(box.dataset.kind==="staff")cfg.staff.splice(i,1);else{const id=cfg.stores[i].id;cfg.stores.splice(i,1);cfg.stores.forEach(s=>{if(s.overflowTo===id)s.overflowTo="";if(s.backupFrom===id)s.backupFrom=""})}saveCfg();render();return}
    if(t.dataset.no){render();return}
    if(box&&box.dataset.kind==="store"){const st=cfg.stores[+box.dataset.i];
      if(t.dataset.midon){const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));st.mid={start:`${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`,weeks:[{}]};saveCfg();render();return}
      if(t.dataset.midadd){st.mid.weeks.push({});saveCfg();render();return}
      if(t.dataset.midrm){st.mid.weeks.pop();saveCfg();render();return}
      if(t.dataset.midoff){delete st.mid;saveCfg();render();return}}
  });
  const add=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn};
  add("addstaff",()=>{if(!cfg.stores.length)return;const s={id:uid(),name:"NEW PERSON",home:cfg.stores[0].id,week:{}};cfg.staff.push(s);saveCfg();render();const el=document.getElementById("sn-"+s.id);if(el){el.focus();el.select()}});
  add("addstore",()=>{cfg.stores.push({id:uid(),name:"NEW STORE",code:"N",maxOpen:2,closers:2,holCrew:"",maxOnDuty:"",overflowTo:"",minOnDuty:"",backupFrom:""});saveCfg();render()});
  add("addhol",()=>{cfg.holidays.push({date:`${cur.y}-${pad(cur.m)}-01`,name:"New holiday",type:"regular"});saveCfg();render()});
}

// ======================= Google Sheet storage =======================
async function api(body){
  if(!conn.url){
    if(body.action==="load")return {ok:true,config:lsGet(LSC)||DEFAULT_CFG,month:lsGet(LSM+body.month)};
    if(body.action==="saveConfig")lsSet(LSC,body.config);
    if(body.action==="saveMonth")lsSet(LSM+body.month,{entries:body.entries});
    return {ok:true};
  }
  const r=await fetch(conn.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pin:conn.pin})});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||"Save failed"); return j;
}
async function loadAll(first){
  const seq=++loadSeq, k=mkey(cur.y,cur.m);
  setStatus("Loading…");
  try{
    const j=await api({action:"load",month:k});
    if(seq!==loadSeq)return;
    const c=j.config||{};
    if(!pendingCfg)cfg={stores:c.stores||[],staff:c.staff||[],holidays:c.holidays||[],settings:c.settings||{sMin:1,sMax:2}};
    if(pendingMonth!==k)entries=(j.month&&j.month.entries)||{};
    cfgLoaded=true;loadErr="";setStatus("Saved ✓");
    if(first&&tab==="setup"&&openSec==="connect")tab="dayoffs";
  }catch(e){if(seq!==loadSeq)return;loadErr=/fetch/i.test(String(e.message||e))?"The sheet couldn't be reached.":String(e.message||e);setStatus("Not connected",true)}
  render();
}
function saveCfg(){
  pendingCfg=true;setStatus("Saving…");clearTimeout(cfgTimer);
  cfgTimer=setTimeout(async()=>{try{await api({action:"saveConfig",config:cfg});pendingCfg=false;setStatus("Saved ✓");saveMonth(true)}catch(e){pendingCfg=false;setStatus("Not saved!",true)}},900);
}
function saveMonth(quiet){
  const k=mkey(cur.y,cur.m);
  pendingMonth=k;if(!quiet)setStatus("Saving…");clearTimeout(monthTimer);
  monthTimer=setTimeout(()=>flushMonth(k),900);
}
async function flushMonth(k){
  const snap=JSON.parse(JSON.stringify(entries));
  let table=null; try{table=scheduleTable(compute())}catch(e){}
  try{await api({action:"saveMonth",month:k,entries:snap,table});if(pendingMonth===k)pendingMonth=null;setStatus("Saved ✓")}
  catch(e){pendingMonth=null;setStatus("Not saved!",true)}
}
function step(dir,f){
  if(pendingMonth){clearTimeout(monthTimer);flushMonth(pendingMonth)}
  let m=cur.m+dir,y=cur.y;if(m<1){m=12;y--}if(m>12){m=1;y++}cur={y,m};entries={};{const N2=new Date(y,m,0).getDate();fd=f==null?defaultDay():f<1?N2+f:f;}
  render();loadAll();
}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;history.replaceState(null,"","#"+tab);render()};
window.addEventListener("focus",()=>{if(cfgLoaded&&!pendingCfg&&!pendingMonth&&!document.activeElement.closest?.("main"))loadAll()});
window.addEventListener("resize",setHdr);
{const v=lsGet("tftg-view");if(["month","week","day"].includes(v))view=v;}
render();loadAll(true);
})();
